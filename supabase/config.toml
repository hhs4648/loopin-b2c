# ---------------------------------------------------------------------------
# 플랫폼 앞단의 JWT 검사를 끈다.
#
# 켜 두면 브라우저의 **CORS 프리플라이트(OPTIONS)** 가 거절된다 — 프리플라이트는
# Authorization 헤더를 못 싣기 때문이다. 그러면 앱에서 `Failed to fetch`만 보이고
# 이유가 안 보인다 (2026-09-06 재현).
#
# 함수가 **자체적으로 더 엄격하게** 검사한다: 토큰으로 /auth/v1/user 를 확인하고,
# anon 키를 그대로 보낸 경우도 거절한다. 앞단 검사는 그보다 느슨하다.
# ---------------------------------------------------------------------------
[functions.dajung-llm]
verify_jwt = false
