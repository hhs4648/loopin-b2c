    <text x="72" y="100" text-anchor="middle" font-size="15" fill="#b08a1a">Building</text><text x="72" y="116" text-anchor="middle" font-size="11" fill="#b08a1a">(건물)</text>
    <path d="M122 90 H152" stroke="#8a7f88" stroke-width="2.5" stroke-linecap="round"/>
