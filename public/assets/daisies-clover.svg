        <ellipse cx="0" cy="-11" rx="4.5" ry="9" transform="rotate(40)"/>
        <ellipse cx="0" cy="-11" rx="4.5" ry="9" transform="rotate(80)"/>
        <ellipse cx="0" cy="-11" rx="4.5" ry="9" transform="rotate(120)"/>
