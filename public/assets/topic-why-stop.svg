<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 170" fill="none">
  <!-- 3월 36번 도입 칠판: 끝없는 왜? — 멈추는 말 -->
  <g font-family="'Gowun Dodum','Noto Sans KR',sans-serif" font-weight="700">
    <text x="170" y="30" text-anchor="middle" font-size="16" fill="#8a7f88">이번 글</text>
    <rect x="18" y="64" width="54" height="36" rx="12" fill="#fff" stroke="#c9b9c0" stroke-width="2"/><text x="45" y="80" text-anchor="middle" font-size="13" fill="#5b4f57">Why?</text><text x="45" y="94" text-anchor="middle" font-size="10" fill="#8a7f88">(왜?)</text>
    <rect x="80" y="64" width="54" height="36" rx="12" fill="#fff" stroke="#c9b9c0" stroke-width="2"/><text x="107" y="80" text-anchor="middle" font-size="13" fill="#5b4f57">Why?</text><text x="107" y="94" text-anchor="middle" font-size="10" fill="#8a7f88">(왜?)</text>
    <rect x="142" y="64" width="54" height="36" rx="12" fill="#fff" stroke="#c9b9c0" stroke-width="2"/><text x="169" y="80" text-anchor="middle" font-size="13" fill="#5b4f57">Why?</text><text x="169" y="94" text-anchor="middle" font-size="10" fill="#8a7f88">(왜?)</text>
    <text x="210" y="88" text-anchor="middle" font-size="18" fill="#8a7f88">…</text>
    <polygon points="262,52 290,52 310,72 310,100 290,120 262,120 242,100 242,72" fill="#ef7a93"/>
    <text x="276" y="84" text-anchor="middle" font-size="13" fill="#fff">Morally</text><text x="276" y="99" text-anchor="middle" font-size="13" fill="#fff">wrong!</text><text x="276" y="140" text-anchor="middle" font-size="11" fill="#c0455f">(도덕적으로 잘못!)</text>
    <text x="170" y="158" text-anchor="middle" font-size="14" fill="#5b4f57">끝없는 고민을 한마디로 멈출 수 있을까?</text>
  </g>
</svg>
