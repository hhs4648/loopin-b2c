<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 190" fill="none">
  <!-- 6월 모평 37번 칠판: 자석 네 개가 정사각형으로 놓인 받침 위에서 추가 흔들린다 — 두 번 놓아도 움직임이 달라진다 -->
  <g font-family="'Gowun Dodum','Noto Sans KR',sans-serif" font-weight="700">
    <!-- 받침과 자석 네 개 (정사각형) -->
    <ellipse cx="128" cy="150" rx="104" ry="26" fill="#f6eff2" stroke="#c9b9c0" stroke-width="2.5"/>
    <g fill="#6c9cf0">
      <rect x="78" y="136" width="18" height="10" rx="3"/><rect x="160" y="136" width="18" height="10" rx="3"/>
      <rect x="92" y="156" width="18" height="10" rx="3"/><rect x="146" y="156" width="18" height="10" rx="3"/>
    </g>
    <text x="128" y="186" text-anchor="middle" font-size="11" fill="#4b7be5">자석 네 개 (four magnets)</text>
    <!-- 기둥과 추 -->
    <path d="M128 18 V30" stroke="#8a7f88" stroke-width="3" stroke-linecap="round"/>
    <path d="M60 18 H196" stroke="#8a7f88" stroke-width="3" stroke-linecap="round"/>
    <path d="M128 30 L112 118" stroke="#8a7f88" stroke-width="2"/>
    <circle cx="112" cy="124" r="9" fill="#ef7a93"/>
    <text x="70" y="106" text-anchor="middle" font-size="11" fill="#c0455f">추 pendulum</text>
    <!-- 처음 놓았을 때 / 두 번째 — 처음엔 같아도 곧 달라진다 -->
    <path d="M112 132 C96 140 84 146 88 150 C100 156 150 160 168 146" stroke="#ef7a93" stroke-width="2" stroke-dasharray="4 4"/>
    <path d="M112 132 C96 140 84 146 88 150 C96 164 110 166 102 160" stroke="#2f9e7e" stroke-width="2" stroke-dasharray="4 4"/>
    <!-- 오른쪽 설명 -->
    <g transform="translate(236 46)">
      <path d="M0 0 H22" stroke="#ef7a93" stroke-width="2.5" stroke-dasharray="4 4"/>
      <text x="28" y="4" font-size="11" fill="#c0455f">처음 놓았을 때</text>
      <path d="M0 22 H22" stroke="#2f9e7e" stroke-width="2.5" stroke-dasharray="4 4"/>
      <text x="28" y="26" font-size="11" fill="#2f7d6c">같은 자리에서 또</text>
      <text x="0" y="58" font-size="12" fill="#5b4f57">처음엔 같아도</text>
      <text x="0" y="76" font-size="12" fill="#5b4f57">곧 완전히 달라져요</text>
      <text x="0" y="100" font-size="12" fill="#c0455f">= chaos(혼돈)</text>
    </g>
  </g>
</svg>
