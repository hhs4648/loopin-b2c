<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 170" fill="none">
  <!-- 6월 37번 도입 칠판: 혼돈 — 같은 출발, 다른 길 -->
  <g font-family="'Gowun Dodum','Noto Sans KR',sans-serif" font-weight="700">
    <text x="170" y="30" text-anchor="middle" font-size="16" fill="#8a7f88">Chaos (혼돈)</text>
    <circle cx="60" cy="90" r="9" fill="#ef7a93"/>
    <path d="M70 90 C120 90 150 70 250 58" stroke="#ef7a93" stroke-width="2.5" stroke-dasharray="5 5"/>
    <path d="M70 90 C120 90 150 110 250 124" stroke="#2f9e7e" stroke-width="2.5" stroke-dasharray="5 5"/>
    <text x="60" y="122" text-anchor="middle" font-size="12" fill="#5b4f57">same start</text><text x="60" y="137" text-anchor="middle" font-size="11" fill="#8a7f88">(같은 출발)</text>
    <text x="292" y="94" text-anchor="middle" font-size="12" fill="#5b4f57">different</text><text x="292" y="108" text-anchor="middle" font-size="12" fill="#5b4f57">paths</text><text x="292" y="123" text-anchor="middle" font-size="11" fill="#8a7f88">(다른 길)</text>
    <text x="170" y="158" text-anchor="middle" font-size="14" fill="#5b4f57">같은 자리에서 시작해도 똑같이 움직일까?</text>
  </g>
</svg>
