<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 190" fill="none">
  <!-- 39번 칠판 ②: 집단 안에는 지식이 있지만, 외부인은 장막(veil)에 막혀 닿기 어렵다 -->
  <g font-family="'Gowun Dodum','Noto Sans KR',sans-serif" font-weight="700">
    <ellipse cx="118" cy="98" rx="98" ry="74" fill="#f2fbf8" stroke="#8fd0c0" stroke-width="3"/>
    <text x="118" y="44" text-anchor="middle" font-size="14" fill="#2f7d6c">전문가 집단</text>
    <!-- 구성원 (가장자리) -->
    <g fill="#8fd0c0">
      <circle cx="58" cy="96" r="8"/><rect x="49" y="106" width="18" height="20" rx="9"/>
      <circle cx="178" cy="96" r="8"/><rect x="169" y="106" width="18" height="20" rx="9"/>
    </g>
    <!-- 가운데 지식 -->
    <rect x="80" y="76" width="76" height="46" rx="10" fill="#fff8e1" stroke="#f2c33d" stroke-width="2.5"/>
    <text x="118" y="98" text-anchor="middle" font-size="15" fill="#b08a1a">지식</text>
    <text x="118" y="114" text-anchor="middle" font-size="11" fill="#b08a1a">knowledge</text>
    <!-- 장막: 집단 오른쪽 경계에 드리운 커튼 -->
    <g stroke="#b4a2ea" stroke-width="2" fill="#e9e4fb">
      <path d="M206 46 C214 70 200 92 210 116 C218 136 204 150 210 160 L222 160 C216 146 230 132 222 112 C214 90 228 70 220 46 Z"/>
    </g>
    <text x="214" y="38" text-anchor="middle" font-size="12" fill="#6a4fa0">장막 veil</text>
    <!-- 외부인: 손을 뻗지만 닿지 않는다 -->
    <g fill="#ef7a93">
      <circle cx="292" cy="88" r="11"/><rect x="279" y="101" width="26" height="30" rx="13"/>
    </g>
    <path d="M279 108 H238" stroke="#ef7a93" stroke-width="3" stroke-linecap="round"/>
    <path d="M232 101 L246 115 M246 101 L232 115" stroke="#c0455f" stroke-width="3" stroke-linecap="round"/>
    <text x="292" y="152" text-anchor="middle" font-size="15" fill="#c0455f">외부인</text>
    <text x="292" y="170" text-anchor="middle" font-size="11" fill="#8a7f88">닿기 어려워요</text>
  </g>
</svg>
