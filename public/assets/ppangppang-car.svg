<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 250" fill="none">
  <!-- 2024년 3월 31번 7문장: 작은 아이(8살)가 커 가면서(16살) 자동차를 '빵빵이' → '자동차'로 부른다. 왼쪽 어릴 때, 오른쪽 자라고 난 뒤 -->
  <defs>
    <marker id="grow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#b9a9b2"/>
    </marker>
  </defs>
  <g font-family="'Gowun Dodum','Noto Sans KR',sans-serif" font-weight="700">
    <!-- 땅 -->
    <path d="M10 184 H350" stroke="#e6dcd3" stroke-width="2"/>

    <!-- 8살: 작은 아이 -->
    <circle cx="44" cy="150" r="8" fill="#f2c8a0"/>
    <rect x="36" y="159" width="16" height="25" rx="6" fill="#2f9d86"/>
    <rect x="12" y="104" width="68" height="28" rx="11" fill="#ffffff" stroke="#8fd0c0" stroke-width="2"/>
    <path d="M38 132 L44 141 L50 132 Z" fill="#ffffff" stroke="#8fd0c0" stroke-width="2" stroke-linejoin="round"/>
    <rect x="39" y="130" width="10" height="4" fill="#ffffff"/>
    <text x="46" y="123" text-anchor="middle" font-size="14" fill="#2f7d6c">빵빵이!</text>

    <!-- 중간: 조금 큰 아이 -->
    <circle cx="124" cy="126" r="10" fill="#f2c8a0"/>
    <rect x="113" y="137" width="22" height="47" rx="7" fill="#9b8fc0"/>
    <rect x="88" y="78" width="74" height="28" rx="11" fill="#ffffff" stroke="#b7aedb" stroke-width="2"/>
    <path d="M118 106 L124 115 L130 106 Z" fill="#ffffff" stroke="#b7aedb" stroke-width="2" stroke-linejoin="round"/>
    <rect x="119" y="104" width="10" height="4" fill="#ffffff"/>
    <text x="125" y="97" text-anchor="middle" font-size="13" fill="#6d5fa0">빵빵… 차?</text>

    <!-- 16살: 다 큰 사람 -->
    <circle cx="208" cy="96" r="12" fill="#f2c8a0"/>
    <rect x="195" y="109" width="26" height="75" rx="8" fill="#e2607d"/>
    <rect x="170" y="44" width="76" height="30" rx="11" fill="#ffffff" stroke="#ef7a93" stroke-width="2"/>
    <path d="M202 74 L208 84 L214 74 Z" fill="#ffffff" stroke="#ef7a93" stroke-width="2" stroke-linejoin="round"/>
    <rect x="203" y="72" width="10" height="4" fill="#ffffff"/>
    <text x="208" y="65" text-anchor="middle" font-size="15" fill="#c0455f">자동차</text>

    <!-- 자동차 -->
    <rect x="262" y="152" width="80" height="24" rx="9" fill="#7da7e0"/>
    <path d="M276 152 L286 136 H318 L328 152 Z" fill="#a9c6ef"/>
    <circle cx="282" cy="178" r="8" fill="#4b4453"/><circle cx="322" cy="178" r="8" fill="#4b4453"/>

    <!-- 나이 화살표 -->
    <path d="M30 206 H226" stroke="#b9a9b2" stroke-width="2.5" marker-end="url(#grow)"/>
    <text x="44" y="224" text-anchor="middle" font-size="12" fill="#2f7d6c">어릴 때 (8살)</text>
    <text x="208" y="224" text-anchor="middle" font-size="12" fill="#c0455f">자라고 난 뒤 (16살)</text>
    <text x="44" y="241" text-anchor="middle" font-size="10.5" fill="#8a7f88">내가 지어낸 말</text>
    <text x="208" y="241" text-anchor="middle" font-size="10.5" fill="#8a7f88">남들이 다 쓰는 말</text>
  </g>
</svg>
