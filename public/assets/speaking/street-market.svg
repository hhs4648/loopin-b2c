    <path d="M488 242 L500 282" stroke="#2f9e7e" stroke-width="11" stroke-linecap="round"/>
    <path d="M488 284 L520 284 L514 320 L494 320 Z" fill="#e39a2d"/>
    <path d="M494 284 Q504 268 514 284" stroke="#b97616" stroke-width="3" fill="none"/>
    <circle cx="467" cy="204" r="21" fill="#f2c7a5"/>
    <path d="M446 204 Q446 178 467 178 Q490 178 489 206 Q484 192 467 190 Q452 192 446 204 Z" fill="#6b4226"/>
    <path d="M447 200 Q440 230 450 236 L452 206 Z" fill="#6b4226"/>
