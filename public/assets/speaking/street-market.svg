<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="야외 시장에서 가운데 남자가 과일 가판대에서 과일을 팔고, 오른쪽 여자가 장바구니를 들고 사과를 고른다. 뒤에 나무와 자전거, 해">
  <!-- 하늘·해·땅 -->
  <rect width="640" height="400" fill="#cfe9fb"/>
  <circle cx="570" cy="60" r="32" fill="#ffd45c"/>
  <rect y="290" width="640" height="110" fill="#d9cbb3"/>
  <!-- 뒤 나무들 -->
  <rect x="58" y="170" width="14" height="120" fill="#8a6a4f"/>
  <circle cx="65" cy="150" r="48" fill="#6cbf7f"/>
  <circle cx="35" cy="175" r="30" fill="#5aae6e"/>
  <rect x="478" y="180" width="12" height="110" fill="#8a6a4f"/>
  <circle cx="484" cy="160" r="42" fill="#6cbf7f"/>
  <!-- 자전거 (뒤) -->
