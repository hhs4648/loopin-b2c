    <circle cx="540" cy="268" r="22"/>
    <circle cx="604" cy="268" r="22"/>
    <path d="M540 268 L566 238 L592 238 L604 268 M566 238 L578 268 L540 268 M592 238 L588 226 M560 232 L574 232"/>
  </g>
  <!-- 가판대 차양 -->
  <path d="M150 110 L420 110 L440 150 L130 150 Z" fill="#ef7a93"/>
  <path d="M168 110 L184 150 M206 110 L222 150 M244 110 L260 150 M282 110 L298 150 M320 110 L336 150 M358 110 L374 150 M396 110 L412 150" stroke="#fff" stroke-width="12" opacity=".8"/>
  <rect x="146" y="150" width="8" height="140" fill="#9b7a5e"/>
  <rect x="416" y="150" width="8" height="140" fill="#9b7a5e"/>
  <!-- 파는 남자 (가운데, 가판대 뒤) -->
  <g>
    <path d="M250 205 Q285 190 320 205 L322 250 L248 250 Z" fill="#5c9cf5"/>
    <rect x="260" y="200" width="50" height="50" rx="6" fill="#f3efe6" opacity=".9"/>
    <circle cx="285" cy="178" r="22" fill="#e8b48f"/>
    <path d="M263 176 Q265 152 285 152 Q306 152 307 176 Q298 164 285 164 Q272 164 263 176 Z" fill="#2c2c2c"/>
    <path d="M318 214 L348 232" stroke="#5c9cf5" stroke-width="12" stroke-linecap="round"/>
    <circle cx="352" cy="235" r="7" fill="#e8b48f"/>
  </g>
  <!-- 가판대 + 과일 -->
  <rect x="150" y="240" width="270" height="56" rx="4" fill="#b98a5c"/>
  <rect x="150" y="240" width="270" height="10" fill="#a2774e"/>
  <g>
    <circle cx="180" cy="234" r="11" fill="#e2403f"/><circle cx="200" cy="232" r="11" fill="#e2403f"/><circle cx="190" cy="222" r="11" fill="#d93636"/>
    <circle cx="232" cy="234" r="10" fill="#f39a2b"/><circle cx="252" cy="234" r="10" fill="#f39a2b"/><circle cx="242" cy="223" r="10" fill="#f0a640"/>
    <path d="M330 236 Q345 210 372 222 Q352 226 340 240 Z" fill="#f2d14b"/><path d="M336 238 Q356 216 384 230 Q362 232 346 242 Z" fill="#efc63b"/>
    <circle cx="398" cy="234" r="10" fill="#7cc35a"/><circle cx="406" cy="224" r="9" fill="#6db84d"/>
  </g>
  <!-- 오른쪽 여자 + 장바구니 -->
  <g>
    <rect x="452" y="300" width="13" height="48" rx="5" fill="#3b3f58"/>
    <rect x="470" y="300" width="13" height="48" rx="5" fill="#3b3f58"/>
    <path d="M446 232 Q467 220 488 232 L494 304 L440 304 Z" fill="#2f9e7e"/>
    <path d="M448 240 L420 250" stroke="#2f9e7e" stroke-width="12" stroke-linecap="round"/>
