class Component extends DCLogic {
  state = { input: '', teacherLine: '오늘의 학습을 시작해볼까요?', studentLine: '', typing: false, turn: 0, seconds: 0, screen: null, studyInput: '', studyLine: '이 문장을 소리 내어 따라 읽고, 어떤 뜻인지 해석해 볼까요?' };
  replies = ['좋아요! 그럼 먼저 어제 배운 내용을 살짝 떠올려 볼까요?', '잘했어요. 이제 첫 번째 문제를 함께 풀어 봅시다.', '천천히 해도 괜찮아요. 모르는 부분이 있으면 언제든 말해 주세요.', '정말 잘 이해했어요! 다음 단계로 넘어가 볼까요?'];
  quickSets = [['네, 좋아요!', '잠시만요', '어떤 걸 배워요?'], ['기억나요', '조금 헷갈려요', '다시 설명해 주세요'], ['네, 풀어볼게요', '힌트 주세요'], ['괜찮아요', '모르는 게 있어요'], ['네, 다음으로!', '한 번 더 볼래요']];
  submit(text) {
    if (!text) return;
    const turn = this.state.turn;
    this.setState({ input: '', studentLine: text, typing: true });
    clearTimeout(this.reply);
    this.reply = setTimeout(() => {
      this.setState({ typing: false, teacherLine: this.replies[turn % this.replies.length], turn: turn + 1 });
      if (turn === 0) this.next = setTimeout(() => this.setState({ screen: 'study' }), 1800);
    }, 1100);
  }
  componentDidMount() {
    this.timer = setInterval(() => this.setState(s => ({ seconds: s.seconds + 1 })), 1000);
    this.onResize = () => this.setState({ stageScale: Math.min(window.innerWidth / 390, window.innerHeight / 844) });
    this.onResize();
    window.addEventListener('resize', this.onResize);
  }
  componentWillUnmount() { clearInterval(this.timer); clearTimeout(this.reply); clearTimeout(this.next); window.removeEventListener('resize', this.onResize); }
  renderVals() {
    const style = this.props.bubbleStyle ?? 'bubble';
    const screen = this.state.screen ?? this.props.screen ?? 'study';
    const m = String(Math.floor(this.state.seconds / 60)).padStart(2, '0');
    const s = String(this.state.seconds % 60).padStart(2, '0');
    return {
      input: this.state.input,
      teacherLine: this.state.teacherLine,
      studentLine: this.state.studentLine,
      hasStudentLine: !!this.state.studentLine,
      typing: this.state.typing,
      notTyping: !this.state.typing,
      isBubble: style === 'bubble',
      isSubtitle: style === 'subtitle',
      elapsed: `${m}:${s}`,
      onInput: e => this.setState({ input: e.target.value }),
      quickReplies: this.quickSets[this.state.turn % this.quickSets.length].map(label => ({ label, pick: () => this.submit(label) })),
      showQuick: !this.state.typing,
      stageTransform: `scale(${this.state.stageScale || Math.min(window.innerWidth / 390, window.innerHeight / 844) || 1})`,
      isChat: screen === 'chat',
      isStudy: screen === 'study',
      goChat: () => { clearTimeout(this.next); this.setState({ screen: 'chat' }); },
      studyInput: this.state.studyInput,
      studyLine: this.state.studyLine,
      onStudyInput: e => this.setState({ studyInput: e.target.value }),
      studyDone: () => this.setState({ studyLine: '잘 읽었어요! 이제 이 문장이 어떤 뜻인지 아래에 적어 볼까요?' }),
      studyHint: () => this.setState({ studyLine: '힌트! raise는 "키우다", personality는 "성격"이라는 뜻이에요.' }),
      sendStudy: e => { e.preventDefault(); if (!this.state.studyInput.trim()) return; this.setState({ studyInput: '', studyLine: '좋아요, 거의 정확해요! "당신이 키우는 반려동물은 어쩐지 당신의 성격을 보여 준다"는 뜻이에요.' }); },
      send: e => { e.preventDefault(); this.submit(this.state.input.trim()); }
    };
  }
}
</script>


</body></html>
